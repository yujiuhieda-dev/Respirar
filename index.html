<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sua Pausa — respire por 2 a 5 minutos</title>
<meta name="description" content="Micro-sessões guiadas de respiração para aliviar a ansiedade.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:oklch(.965 .018 85);--fg:oklch(.32 .03 140);--card:oklch(.985 .012 85);--primary:oklch(.52 .06 140);--pfg:oklch(.98 .01 85);--muted:oklch(.93 .02 90);--mfg:oklch(.52 .025 130);--border:oklch(.88 .02 100);--sage:oklch(.66 .055 140);--sage-soft:oklch(.84 .04 135);--sun:oklch(.86 .1 80);--ease:cubic-bezier(.45,0,.55,1)}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--fg);font-family:"Work Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
.wrap{max-width:1024px;margin:auto;padding:24px}header.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:1.6rem}.tag{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mfg)}
.grid{display:grid;gap:48px;padding-top:32px}@media(min-width:768px){.grid{grid-template-columns:1.1fr 1fr;align-items:center}}
h1{font-size:clamp(3rem,7vw,4.5rem);line-height:1.05}h1 em{color:var(--primary)}.lead{margin-top:24px;max-width:28rem;font-size:1.1rem;line-height:1.7;color:var(--mfg)}
.ex{display:block;width:100%;text-align:left;margin-top:12px;padding:20px;border-radius:18px;border:1px solid transparent;background:color-mix(in oklab,var(--muted) 50%,transparent);transition:.3s}
.ex[aria-pressed=true]{background:var(--card);border-color:color-mix(in oklab,var(--primary) 40%,transparent);box-shadow:0 1px 3px #0001}
.ex .row{display:flex;justify-content:space-between;gap:16px}.ex b{font-weight:500}.ex small,.ex p{color:var(--mfg);font-size:.875rem}.ex p{margin-top:4px}
.controls{margin-top:32px;display:flex;flex-wrap:wrap;gap:24px;align-items:center}.seg{display:flex;background:var(--muted);border-radius:99px;padding:4px}
.seg button{padding:8px 16px;border-radius:99px;font-size:.875rem;color:var(--mfg)}.seg button[aria-pressed=true]{background:var(--card);color:var(--fg)}
.btn{background:var(--primary);color:var(--pfg);padding:12px 32px;border-radius:99px;font-size:.875rem;font-weight:500}.btn:hover{opacity:.9}
.ghost{border:1px solid color-mix(in oklab,var(--fg) 20%,transparent);background:color-mix(in oklab,var(--card) 60%,transparent);padding:12px 28px;border-radius:99px;font-size:.875rem;backdrop-filter:blur(6px)}
aside{position:relative}aside img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:2rem;display:block}
figure{position:absolute;left:24px;right:24px;bottom:-24px;background:color-mix(in oklab,var(--card) 90%,transparent);backdrop-filter:blur(6px);padding:20px;border-radius:18px}
figure p{margin-top:8px;font-size:1.25rem;line-height:1.35}footer{font-size:.75rem;color:var(--mfg);padding-top:64px}
#session{display:none;position:fixed;inset:0;overflow:hidden;flex-direction:column;background:var(--bg)}
#session .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 2s;pointer-events:none}
#session .veil{position:absolute;inset:0;background:color-mix(in oklab,var(--bg) 40%,transparent)}
.shead{position:relative;z-index:1;display:flex;justify-content:space-between;padding:20px 32px;font-size:.875rem;color:var(--mfg)}
.smain{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px 64px}
.stage{position:relative;width:min(24rem,75vw);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.halo,.orb{position:absolute;border-radius:50%;transition-property:transform,opacity;transition-timing-function:var(--ease)}
.halo{inset:0;background:color-mix(in oklab,var(--sage-soft) 40%,transparent)}.orb{inset:24px;background:radial-gradient(circle at 35% 30%,var(--sun),var(--sage-soft) 55%,var(--sage));box-shadow:0 30px 80px -20px color-mix(in oklab,var(--sage) 55%,transparent)}
.label{position:relative;display:flex;flex-direction:column;align-items:center}#plabel{font-size:3.5rem}#pcount{margin-top:8px;font-size:1.1rem;opacity:.7}
#cue{margin-top:48px;max-width:28rem;font-size:1.1rem;line-height:1.7;opacity:.85}.fade{animation:fade .9s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.halo,.orb{transition:none!important}}
</style>
</head>
<body>
<div id="home" class="wrap">
  <header class="top"><span class="logo serif">Sua Pausa</span><span class="tag">2 – 5 min</span></header>
  <main class="grid">
    <section class="fade">
      <h1 class="serif">Respire.<br><em>Você tem tempo.</em></h1>
      <p class="lead">Uma pausa curta para o corpo lembrar que está seguro. Escolha um ritmo, siga o círculo e deixe o resto esperar alguns minutos.</p>
      <div id="exlist" style="margin-top:28px"></div>
      <div class="controls">
        <div class="seg" id="dur" role="group" aria-label="Duração"></div>
        <button class="btn" id="start">Começar pausa</button>
      </div>
    </section>
    <aside class="fade">
      <img id="hero" alt="Pedras empilhadas com uma folha, em tons de sálvia e areia" width="816" height="816">
      <figure><span class="tag">Imagem guiada</span><p class="serif" id="metaphor"></p></figure>
    </aside>
  </main>
  <footer>Sua Pausa não substitui acompanhamento profissional. Se a ansiedade persistir, procure um psicólogo ou o CVV (188).</footer>
</div>

<div id="session">
  <img class="bgimg" data-k="inhale" alt="">
  <img class="bgimg" data-k="hold" alt="">
  <img class="bgimg" data-k="exhale" alt="">
  <img class="bgimg" data-k="rest" alt="">
  <div class="veil"></div>
  <div class="shead"><button id="back">← Voltar</button><span id="clock"></span></div>
  <div class="smain">
    <div class="stage"><div class="halo" id="halo"></div><div class="orb" id="orb"></div>
      <div class="label"><span class="serif" id="plabel"></span><span id="pcount"></span></div></div>
    <p id="cue"></p>
    <div style="margin-top:40px"><button class="ghost" id="pause">Pausar</button></div>
  </div>
</div>

<script>
const EXERCISES=[
 {id:"box",name:"Respiração quadrada",pattern:"4 · 4 · 4 · 4",summary:"Equilibra o sistema nervoso e devolve foco em momentos de pressão.",
  metaphor:"Imagine que você desenha um quadrado com a respiração. Cada lado tem o mesmo tamanho — firme, previsível, seguro.",
  phases:[{k:"inhale",s:4,l:"Inspire",c:"Deixe o ar entrar devagar, como o sol nascendo sobre as colinas."},{k:"hold",s:4,l:"Segure",c:"Fique imóvel, como um lago calmo sob a lua."},{k:"exhale",s:4,l:"Expire",c:"Solte o ar como uma onda que volta para o mar."},{k:"rest",s:4,l:"Pausa",c:"Repouse no vazio. Nada a fazer agora."}]},
 {id:"478",name:"Respiração 4-7-8",pattern:"4 · 7 · 8",summary:"Uma expiração longa sinaliza ao corpo que é seguro desacelerar.",
  metaphor:"Pense numa vela à sua frente. Ao expirar, sopre tão suavemente que a chama apenas balance, sem se apagar.",
  phases:[{k:"inhale",s:4,l:"Inspire",c:"Pelo nariz, sem pressa. Sinta o peito se abrir."},{k:"hold",s:7,l:"Segure",c:"Guarde o ar com gentileza. Você está seguro aqui."},{k:"exhale",s:8,l:"Expire",c:"Pela boca, longo e suave, como um suspiro de alívio."}]},
 {id:"coherent",name:"Respiração coerente",pattern:"5 · 5",summary:"Ritmo suave e contínuo, ideal para ansiedade difusa ao longo do dia.",
  metaphor:"Visualize uma maré: sobe e desce no seu próprio tempo, sem esforço. Você é apenas a água acompanhando o movimento.",
  phases:[{k:"inhale",s:5,l:"Inspire",c:"A maré sobe. Deixe o ar preencher a barriga."},{k:"exhale",s:5,l:"Expire",c:"A maré desce. Os ombros se soltam."}]}
];
const DURS=[2,3,5];let ex=EXERCISES[0],minutes=3;const $=id=>document.getElementById(id);

function renderHome(){
 $("exlist").innerHTML=EXERCISES.map(e=>`<button class="ex" data-id="${e.id}" aria-pressed="${e===ex}"><div class="row"><b>${e.name}</b><small>${e.pattern}</small></div><p>${e.summary}</p></button>`).join("");
 $("dur").innerHTML=DURS.map(m=>`<button data-m="${m}" aria-pressed="${m===minutes}">${m} min</button>`).join("");
 const mp=$("metaphor");mp.textContent=ex.metaphor;mp.classList.remove("fade");void mp.offsetWidth;mp.classList.add("fade");
}
$("exlist").onclick=e=>{const b=e.target.closest("[data-id]");if(b){ex=EXERCISES.find(x=>x.id===b.dataset.id);renderHome()}};
$("dur").onclick=e=>{const b=e.target.closest("[data-m]");if(b){minutes=+b.dataset.m;renderHome()}};

function phaseAt(e,t){const tot=e.phases.reduce((a,p)=>a+p.s,0);t=t%tot;for(let i=0;i<e.phases.length;i++){const p=e.phases[i];if(t<p.s)return{i,p,rem:p.s-t};t-=p.s}return{i:0,p:e.phases[0],rem:0}}

let raf,start,offset,paused,total,lastIdx,done;
function setText(el,txt){if(el.textContent!==txt){el.textContent=txt;el.classList.remove("fade");void el.offsetWidth;el.classList.add("fade")}}
function showImg(k){document.querySelectorAll(".bgimg").forEach(i=>i.style.opacity=i.dataset.k===k?.55:0)}
function frame(now){
 if(start==null)start=now;const el=Math.min(offset+(now-start)/1000,total);
 const left=Math.ceil(total-el);$("clock").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
 if(el>=total){finish();return}
 const {i,p,rem}=phaseAt(ex,el);
 if(i!==lastIdx){lastIdx=i;const prev=ex.phases[(i-1+ex.phases.length)%ex.phases.length].k;
  const exp=p.k==="inhale"||(p.k==="hold"&&prev==="inhale");const sc=exp?1:.55;
  $("orb").style.transitionDuration=$("halo").style.transitionDuration=p.s+"s";
  $("orb").style.transform=`scale(${sc})`;$("halo").style.transform=`scale(${sc*1.15})`;$("halo").style.opacity=exp?.9:.4;
  setText($("plabel"),p.l);setText($("cue"),p.c);showImg(p.k)}
 $("pcount").textContent=Math.ceil(rem);raf=requestAnimationFrame(frame);
}
function finish(){done=true;$("orb").style.transitionDuration="2s";$("orb").style.transform="scale(.7)";$("halo").style.opacity=.4;
 setText($("plabel"),"Obrigado");$("pcount").textContent="";setText($("cue"),"Você se deu esse tempo. Note como o corpo está agora — sem julgamento, apenas observando.");
 showImg("rest");$("pause").textContent="Encerrar pausa";$("pause").className="btn"}
function begin(){total=minutes*60;offset=0;start=null;paused=false;done=false;lastIdx=-1;
 $("pause").textContent="Pausar";$("pause").className="ghost";$("orb").style.transitionDuration="0s";$("orb").style.transform="scale(.55)";$("halo").style.transform="scale(.63)";
 $("home").style.display="none";$("session").style.display="flex";requestAnimationFrame(()=>raf=requestAnimationFrame(frame))}
function exit(){cancelAnimationFrame(raf);$("session").style.display="none";$("home").style.display="block"}
$("start").onclick=begin;$("back").onclick=exit;
$("pause").onclick=()=>{if(done)return exit();paused=!paused;
 if(paused){cancelAnimationFrame(raf);offset+=(performance.now()-start)/1000;$("pause").textContent="Continuar"}
 else{start=null;$("pause").textContent="Pausar";raf=requestAnimationFrame(frame)}};
